<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عالم ألعاب الأبطال</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{font-family:'Baloo Bhaijaan 2',cursive,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:linear-gradient(180deg,#bbf2f6 0%,#d8f5ff 40%,#fff7d6 100%);min-height:100vh;overflow-x:hidden;position:relative}
.cloud{position:absolute;background:rgba(255,255,255,.85);border-radius:999px;animation:floatCloud linear infinite;z-index:0;pointer-events:none}
@keyframes floatCloud{from{transform:translateX(110vw)}to{transform:translateX(-30vw)}}
@keyframes gentleWiggle{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.05)}}
.animate-wiggle{animation:gentleWiggle 3s ease-in-out infinite}
.kid-btn{box-shadow:0 6px 0 rgba(0,0,0,.15),0 12px 18px rgba(0,0,0,.1);transition:all .15s cubic-bezier(.4,0,.2,1)}
.kid-btn:hover{transform:translateY(-3px)}
.kid-btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.pop-sticker{transition:transform .2s cubic-bezier(.34,1.56,.64,1);cursor:pointer}
.pop-sticker:hover{transform:scale(1.25) rotate(8deg)}
.pop-sticker:active{transform:scale(.85) rotate(-8deg)}
/* modal */
#gameModal{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);z-index:50;display:none;align-items:center;justify-content:center;padding:12px}
#gameModal.open{display:flex}
#gameBox{background:#fff;border-radius:28px;width:100%;max-width:820px;max-height:95vh;overflow:auto;border:5px solid #fbbf24;box-shadow:0 25px 60px rgba(0,0,0,.3)}
/* memory */
.mem-card{aspect-ratio:1;border-radius:16px;font-size:2.4rem;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#0ea5e9;border:3px solid #0369a1;transition:transform .25s;color:#fff}
.mem-card.flipped{background:#fff;transform:rotateY(180deg)}
.mem-card.matched{background:#bbf7d0;border-color:#16a34a;cursor:default}
/* shadow match */
.sh-item{font-size:2.8rem;padding:6px 10px;border-radius:14px;cursor:pointer;background:#fff7ed;border:3px solid #fdba74;transition:transform .15s}
.sh-item.sel{transform:scale(1.2);border-color:#f59e0b;background:#fef3c7}
.sh-slot{font-size:2.8rem;padding:6px 10px;border-radius:14px;cursor:pointer;background:#e2e8f0;border:3px dashed #94a3b8;filter:none}
.sh-slot span{filter:brightness(0) opacity(.7)}
.sh-slot.done{background:#bbf7d0;border:3px solid #16a34a}
.sh-slot.done span{filter:none}
/* maze */
.mz-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.3rem;border-radius:6px}
.mz-wall{background:#4f46e5}
.mz-path{background:#fef3c7}
/* coloring */
.col-swatch{width:42px;height:42px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer}
.col-swatch.sel{outline:4px solid #0f172a}
svg .fillable{cursor:pointer;stroke:#0f172a;stroke-width:3;stroke-linejoin:round}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body class="text-slate-800 flex flex-col justify-between">

<div class="cloud w-52 h-20 top-12 left-10" style="animation-duration:45s"></div>
<div class="cloud w-72 h-24 top-48 right-5" style="animation-duration:65s;animation-delay:-20s"></div>
<div class="cloud w-40 h-16 top-96 left-1/3" style="animation-duration:50s;animation-delay:-10s"></div>

<div class="relative z-10 max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">

<header class="flex flex-wrap items-center justify-between gap-3 bg-white/80 backdrop-blur-md rounded-3xl p-4 sm:p-5 shadow-lg border-4 border-amber-300 mb-8">
  <div class="flex items-center gap-3">
    <div class="w-14 h-14 sm:w-16 sm:h-16 bg-gradient-to-tr from-amber-400 to-yellow-300 rounded-2xl flex items-center justify-center text-3xl sm:text-4xl shadow-md animate-wiggle">🦁</div>
    <div>
      <h1 data-t="title" class="text-xl sm:text-3xl font-black text-amber-600 leading-none"></h1>
      <p data-t="subtitle" class="text-xs sm:text-sm font-bold text-slate-500 mt-1"></p>
    </div>
  </div>
  <div class="flex items-center justify-center gap-2 sm:gap-3 w-full sm:w-auto">
    <div id="starBox" class="flex items-center gap-2 bg-amber-100 border-2 border-amber-400 px-3 sm:px-4 py-2 rounded-2xl shadow-inner font-extrabold text-amber-800 text-sm sm:text-lg transition-transform">
      <span class="text-2xl">⭐</span><span id="starCounter">0</span><span data-t="stars" class="hidden sm:inline text-xs text-amber-700"></span>
    </div>
    <button id="langToggle" class="kid-btn bg-indigo-500 text-white font-black rounded-2xl flex items-center justify-center text-lg w-12 h-12 border-2 border-indigo-600" aria-label="Language"></button>
    <button id="soundToggle" class="kid-btn bg-emerald-400 text-white font-extrabold rounded-2xl flex items-center justify-center text-2xl w-12 h-12 border-2 border-emerald-500"><span id="soundIcon">🔊</span></button>
  </div>
</header>

<div class="bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 rounded-3xl p-6 sm:p-8 text-white text-center shadow-xl mb-10 border-4 border-white/60 relative overflow-hidden">
  <div class="absolute -right-8 -bottom-8 text-8xl opacity-20 pointer-events-none">🚀</div>
  <div class="absolute -left-6 -top-6 text-7xl opacity-20 pointer-events-none">🎈</div>
  <h2 data-t="welcome" class="text-2xl sm:text-4xl font-extrabold mb-2 drop-shadow-md"></h2>
  <p data-t="welcomeSub" class="text-sm sm:text-lg font-medium opacity-95 max-w-xl mx-auto"></p>
</div>

<div id="helloBar" class="hidden text-center font-black text-lg text-slate-700 bg-white/80 rounded-2xl border-2 border-sky-200 py-2 mb-6"></div>

<div id="ageTabs" class="flex flex-wrap justify-center gap-2 sm:gap-3 mb-6"></div>

<main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8 mb-12" id="gamesGrid"></main>

<section class="bg-white/90 backdrop-blur-md rounded-3xl p-6 sm:p-8 border-4 border-amber-400 shadow-xl text-center mb-8">
  <h3 data-t="prizes" class="text-2xl sm:text-3xl font-black text-amber-600 mb-2"></h3>
  <p data-t="prizesSub" class="text-slate-600 font-bold mb-6 text-sm sm:text-base"></p>
  <div class="flex flex-wrap items-center justify-center gap-4 sm:gap-8 text-4xl sm:text-6xl py-3">
    <button onclick="popSticker(this)" class="pop-sticker p-3 bg-amber-50 rounded-2xl border-2 border-amber-200 shadow-md">⭐</button>
    <button onclick="popSticker(this)" class="pop-sticker p-3 bg-rose-50 rounded-2xl border-2 border-rose-200 shadow-md">🎈</button>
    <button onclick="popSticker(this)" class="pop-sticker p-3 bg-orange-50 rounded-2xl border-2 border-orange-200 shadow-md">🦁</button>
    <button onclick="popSticker(this)" class="pop-sticker p-3 bg-sky-50 rounded-2xl border-2 border-sky-200 shadow-md">🚀</button>
    <button onclick="popSticker(this)" class="pop-sticker p-3 bg-pink-50 rounded-2xl border-2 border-pink-200 shadow-md">🍭</button>
    <button onclick="popSticker(this)" class="pop-sticker p-3 bg-purple-50 rounded-2xl border-2 border-purple-200 shadow-md">🎨</button>
    <button onclick="popSticker(this)" class="pop-sticker p-3 bg-yellow-50 rounded-2xl border-2 border-yellow-200 shadow-md">🏆</button>
  </div>
</section>
</div>

<footer class="text-center py-6 text-slate-500 font-bold text-xs sm:text-sm bg-white/50 backdrop-blur border-t border-slate-200"><p data-t="footer"></p></footer>

<!-- Register Modal -->
<div id="regModal" style="position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:12px;overflow-y:auto">
  <form id="regForm" style="margin:auto 0" class="bg-white rounded-3xl border-4 border-amber-400 shadow-2xl w-full max-w-md p-6">
    <div class="text-center text-5xl mb-2">🦁</div>
    <h3 data-t="regTitle" class="text-2xl font-black text-amber-600 text-center mb-1"></h3>
    <p data-t="regSub" class="text-center text-sm font-bold text-slate-500 mb-4"></p>
    <label data-t="regName" class="block font-black text-slate-700 mb-1"></label>
    <input id="regName" required maxlength="40" class="w-full border-4 border-sky-200 focus:border-sky-400 outline-none rounded-2xl px-4 py-3 text-lg font-bold mb-3">
    <label data-t="regAge" class="block font-black text-slate-700 mb-1"></label>
    <div id="regAges" class="flex flex-wrap gap-2 mb-3"></div>
    <label data-t="regPhone" class="block font-black text-slate-700 mb-1"></label>
    <input id="regPhone" required inputmode="tel" pattern="[0-9+ ]{10,15}" maxlength="15" dir="ltr" class="w-full border-4 border-sky-200 focus:border-sky-400 outline-none rounded-2xl px-4 py-3 text-lg font-bold mb-2 text-left" placeholder="01xxxxxxxxx">
    <p data-t="regPrivacy" class="text-xs font-bold text-slate-400 mb-4"></p>
    <p id="regErr" class="text-rose-600 font-bold text-sm mb-2 hidden"></p>
    <button id="regBtn" type="submit" class="kid-btn w-full bg-emerald-500 text-white font-black text-xl py-3 rounded-2xl border-2 border-emerald-600"></button>
  </form>
</div>

<!-- Game Modal -->
<div id="gameModal">
  <div id="gameBox">
    <div class="flex items-center justify-between p-4 border-b-4 border-amber-200 bg-amber-50 sticky top-0 z-10">

      <div class="flex gap-2">
        <button onclick="restartGame()" data-t="restart" class="kid-btn bg-sky-500 text-white font-black px-3 py-2 rounded-xl border-2 border-sky-600"></button>
        <button onclick="closeGame()" data-t="exit" class="kid-btn bg-rose-500 text-white font-black px-3 py-2 rounded-xl border-2 border-rose-600"></button>
      </div>
    </div>
    <div id="gameArea" class="p-4 sm:p-6"></div>
  </div>
</div>

let lang=store.get('khzLang')||'ar';

const num=n=>lang==='ar'?String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]):String(n);

function applyLang(){
 document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.title=lang==='ar'?'عالم ألعاب الأبطال':'Heroes Games World';
 document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
 document.getElementById('regName').placeholder=t('regNamePh');
 document.getElementById('regBtn').textContent=t('regBtn');
 document.getElementById('langToggle').textContent=t('langBtn');
 renderCards(); showHello();
 if(document.getElementById('regModal').style.display==='flex') renderAges();
 if(document.getElementById('gameModal').classList.contains('open')){ setGameTitle(); restartGame(); }
}

let soundEnabled=true, starCount=0, audioCtx=null, currentGame=null, gameCleanup=null;
function ctx(){ if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();} if(audioCtx.state==='suspended')audioCtx.resume(); return audioCtx;}
function tone(freq,dur=0.15,type='sine',vol=0.25){ if(!soundEnabled)return; try{const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime);g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);}catch(e){} }
function pop(){ tone(450+Math.random()*200,0.2); }
function good(){ tone(660,0.12,'triangle'); setTimeout(()=>tone(880,0.15,'triangle'),100); }
function bad(){ tone(180,0.25,'sawtooth',0.15); }
function cheer(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>setTimeout(()=>tone(f,0.25,'triangle',0.2),i*90)); }
function addStars(n=1){ starCount+=n; document.getElementById('starCounter').textContent=starCount; const b=document.getElementById('starBox'); b.classList.add('scale-110'); setTimeout(()=>b.classList.remove('scale-110'),200); }
function burst(o={y:0.6}){ confetti({particleCount:60,spread:70,origin:o}); }
function win(stars=10,msg){ cheer(); addStars(stars); burst({y:0.5}); const a=document.getElementById('gameArea'); const d=document.createElement('div'); d.className='text-center mt-4 bg-green-100 border-4 border-green-400 rounded-2xl p-4 text-2xl font-black text-green-700'; d.innerHTML=(msg||t('winMsg'))+'<br><span class="text-base">'+t('youGot')+' '+num(stars)+' ⭐</span>'; a.appendChild(d); }
function popSticker(el){ pop(); addStars(1); const r=el.getBoundingClientRect(); confetti({particleCount:20,spread:45,origin:{x:(r.left+r.width/2)/innerWidth,y:(r.top+r.height/2)/innerHeight},colors:['#f59e0b','#ec4899','#3b82f6','#10b981']}); }
document.getElementById('soundToggle').addEventListener('click',()=>{soundEnabled=!soundEnabled;document.getElementById('soundIcon').textContent=soundEnabled?'🔊':'🔇';if(soundEnabled)tone(600,0.2);});
document.getElementById('langToggle').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';store.set('khzLang',lang);pop();applyLang();});
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ===== 1. Memory ===== */
function memoryGame(){
 const a=document.getElementById('gameArea');
 const em=shuffle(['🐶','🐱','🐸','🦋','🍎','🌈']); const cards=shuffle([...em,...em]);
 let first=null,lock=false,matched=0,moves=0;
 a.innerHTML=`<p class="text-center font-bold text-slate-600 mb-3">${t('memHint')} &nbsp; ${t('moves')} <span id="memMoves">${num(0)}</span></p><div id="memGrid" class="grid grid-cols-4 gap-3 max-w-md mx-auto"></div>`;
 const grid=a.querySelector('#memGrid');
 cards.forEach(e=>{const c=document.createElement('div');c.className='mem-card';c.textContent='❓';c.dataset.e=e;
  c.onclick=()=>{ if(lock||c.classList.contains('flipped'))return; pop(); c.classList.add('flipped'); c.textContent=e;
   if(!first){first=c;return;} moves++; a.querySelector('#memMoves').textContent=num(moves);
   if(first.dataset.e===e){ first.classList.add('matched'); c.classList.add('matched'); first=null; matched++; good(); if(matched===em.length) setTimeout(()=>win(10),300); }
   else{ lock=true; const f=first; first=null; setTimeout(()=>{f.classList.remove('flipped');c.classList.remove('flipped');f.textContent='❓';c.textContent='❓';lock=false;},800); }
  }; grid.appendChild(c);});
}

/* ===== 2. Letter catcher (canvas) ===== */
function letterGame(){
 const a=document.getElementById('gameArea');
 a.innerHTML=`<div class="text-center font-black text-lg mb-2">${t('lcCatch')} <span id="lcTarget" class="text-rose-600 text-3xl"></span> &nbsp; ${t('lcScore')} <span id="lcScore">${num(0)}</span>/${num(5)} &nbsp; ❤️ <span id="lcLives">${num(3)}</span></div>
 <canvas id="lcCanvas" width="600" height="300" class="mx-auto block rounded-2xl border-4 border-rose-300" style="background:linear-gradient(#e0f2fe,#fde68a);touch-action:none;width:min(100%,84vh);aspect-ratio:2/1"></canvas>
 <div class="flex justify-center gap-4 mt-3" dir="ltr"><button id="lcL" class="kid-btn bg-rose-500 text-white font-black text-2xl px-8 py-2 rounded-2xl border-2 border-rose-600">⬅</button><button id="lcR" class="kid-btn bg-rose-500 text-white font-black text-2xl px-8 py-2 rounded-2xl border-2 border-rose-600">➡</button></div>`;
 const cv=a.querySelector('#lcCanvas'),c=cv.getContext('2d');
 const letters=lang==='ar'?['أ','ب','ت','ج','د','ر','س','ع','ف','م','ن','و']:['A','B','C','D','E','F','G','H','K','M','S','T'];
 let target,bx=270,drops=[],score=0,lives=3,running=true,dir=0,raf,spawn;
 const newTarget=()=>{target=letters[Math.floor(Math.random()*letters.length)];a.querySelector('#lcTarget').textContent=target;};
 newTarget();
 const mk=()=>{ const tl=Math.random()<0.45?target:letters[Math.floor(Math.random()*letters.length)]; drops.push({x:40+Math.random()*520,y:-30,l:tl,v:1.2+Math.random()*1}); };
 spawn=setInterval(mk,1200);
 const move=x=>{bx=Math.max(0,Math.min(520,x-40));};
 cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();move((e.clientX-r.left)*600/r.width);});
 cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();move((e.clientX-r.left)*600/r.width);});
 const L=a.querySelector('#lcL'),R=a.querySelector('#lcR');
 const hold=(b,d)=>{b.onpointerdown=()=>dir=d;b.onpointerup=b.onpointerleave=()=>dir=0;};
 hold(L,-1);hold(R,1);
 const key=e=>{if(e.key==='ArrowLeft')dir=-1;if(e.key==='ArrowRight')dir=1;}; const keyU=()=>dir=0;
 window.addEventListener('keydown',key);window.addEventListener('keyup',keyU);
 function loop(){ if(!running)return; bx=Math.max(0,Math.min(520,bx+dir*6));
  c.clearRect(0,0,600,300);
  c.font='900 64px "Baloo Bhaijaan 2", Arial, sans-serif'; c.textAlign='center'; c.textBaseline='middle';
  drops.forEach(d=>{d.y+=d.v; c.fillStyle=d.l===target?'#be123c':'#1e3a8a'; c.fillText(d.l,d.x,d.y);});
  /* basket: drawn shape so it is always visible */
  c.fillStyle='#b45309'; c.beginPath(); c.moveTo(bx,250); c.lineTo(bx+80,250); c.lineTo(bx+68,295); c.lineTo(bx+12,295); c.closePath(); c.fill();
  c.strokeStyle='#78350f'; c.lineWidth=4; c.stroke();
  c.strokeStyle='#fbbf24'; c.lineWidth=3; for(let i=1;i<4;i++){c.beginPath();c.moveTo(bx+8,250+i*11);c.lineTo(bx+72,250+i*11);c.stroke();}
  drops=drops.filter(d=>{ if(d.y>235&&d.y<300&&Math.abs(d.x-(bx+40))<45){ if(d.l===target){score++;good();a.querySelector('#lcScore').textContent=num(score);newTarget();}else{lives--;bad();a.querySelector('#lcLives').textContent=num(lives);} return false;} if(d.y>320){ if(d.l===target){lives--;bad();a.querySelector('#lcLives').textContent=num(lives);} return false;} return true;});
  if(score>=5){running=false;stop();win(10);return;}
  if(lives<=0){running=false;stop();const d=document.createElement('div');d.className='text-center mt-3 text-xl font-black text-rose-600';d.textContent=t('lcLose');a.appendChild(d);return;}
  raf=requestAnimationFrame(loop);
 }
 function stop(){cancelAnimationFrame(raf);clearInterval(spawn);window.removeEventListener('keydown',key);window.removeEventListener('keyup',keyU);}
 gameCleanup=()=>{running=false;stop();};
 loop();
}

/* ===== 3. Shadow match ===== */
function shadowGame(){
 const a=document.getElementById('gameArea');
 const SETS=[
  {k:'set_animals',pool:['🐘','🦒','🐢','🦁','🐱','🐶','🐰','🐸','🦊','🐼','🐨','🐮','🐷','🐵','🦓','🐧']},
  {k:'set_fruits',pool:['🍌','🍓','🍎','🍇','🍉','🍍','🥕','🌽','🍒','🥦','🍋','🍐','🥑','🍑']},
  {k:'set_vehicles',pool:['🚗','🚌','🚲','✈️','🚀','🚁','🚂','⛵','🏍️','🚜','🛵','🚒']},
  {k:'set_toys',pool:['⚽','🏀','🎸','🧸','🎈','🪁','🎺','🥁','🎲','🧩','🏆','🎁']},
  {k:'set_around',pool:['🏠','🌳','🌸','☀️','🌙','⭐','☂️','👒','👟','🎒','📚','🧁']},
 ];
 let level=0;
 function round(){
  const set=SETS[level%SETS.length]; const count=Math.min(4+Math.floor(level/2),8);
  const items=shuffle([...set.pool]).slice(0,count); let sel=null,done=0;
  a.innerHTML=`<div class="flex justify-between items-center mb-3 bg-amber-50 rounded-xl px-3 py-2 border-2 border-amber-200"><span class="font-black text-amber-700">${t('level')} ${num(level+1)}</span><span class="font-bold text-slate-600">${t(set.k)}</span></div>
  <p class="text-center font-bold text-slate-600 mb-3">${t('shHint')}</p>
  <div id="shItems" class="flex flex-wrap justify-center gap-3 mb-5"></div>
  <div class="text-center text-3xl mb-2">⬇️</div>
  <div id="shSlots" class="flex flex-wrap justify-center gap-3"></div>`;
  const I=a.querySelector('#shItems'),S=a.querySelector('#shSlots');
  items.forEach(e=>{const d=document.createElement('div');d.className='sh-item';d.textContent=e;d.dataset.e=e;d.onclick=()=>{if(d.classList.contains('hidden'))return;pop();I.querySelectorAll('.sh-item').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');sel=d;};I.appendChild(d);});
  shuffle([...items]).forEach(e=>{const s=document.createElement('div');s.className='sh-slot';s.innerHTML='<span>'+e+'</span>';s.dataset.e=e;
   s.onclick=()=>{ if(!sel||s.classList.contains('done'))return; if(sel.dataset.e===e){s.classList.add('done');sel.classList.add('hidden');sel=null;good();done++;
     if(done===items.length){ setTimeout(()=>{ win(5+level*2,t('shWin')+' '+num(level+1)+' 🏆'); const b=document.createElement('button'); b.className='kid-btn block mx-auto mt-3 bg-amber-500 text-white font-black text-lg px-6 py-3 rounded-2xl border-2 border-amber-600'; b.textContent=t('nextLevel'); b.onclick=()=>{level++;cheer();round();}; a.appendChild(b); },300); }
   }else{bad();s.classList.add('shake');setTimeout(()=>s.classList.remove('shake'),300);} };
   S.appendChild(s);});
 }
 round();
}

/* ===== 4. Maze ===== */
function mazeGame(){
 const a=document.getElementById('gameArea');
 const maps=[
 ["#########","#S..#...#","#.#.#.#.#","#.#...#.#","#.#####.#","#.......#","###.###.#","#...#..H#","#########"],
 ["#########","#S.#....#","##.#.##.#","#..#..#.#","#.##.##.#","#....#..#","#.####.##","#......H#","#########"],
 ["#########","#S......#","#.#####.#","#.#...#.#","#.#.#.#.#","#...#.#.#","#####.#.#","#H....#.#","#########"]];
 const m=maps[Math.floor(Math.random()*maps.length)].map(r=>r.split(''));
 let p={r:0,c:0},h={r:0,c:0};
 m.forEach((row,r)=>row.forEach((ch,c)=>{if(ch==='S')p={r,c};if(ch==='H')h={r,c};}));
 a.innerHTML=`<p class="text-center font-bold text-slate-600 mb-3">${t('mzHint')}</p><div id="mzGrid" dir="ltr" class="grid gap-1 max-w-sm mx-auto" style="grid-template-columns:repeat(9,1fr)"></div>
 <div class="grid grid-cols-3 gap-2 max-w-[200px] mx-auto mt-4" dir="ltr">
  <div></div><button data-d="u" class="mzb kid-btn bg-emerald-500 text-white text-2xl py-2 rounded-xl border-2 border-emerald-600">⬆</button><div></div>
  <button data-d="l" class="mzb kid-btn bg-emerald-500 text-white text-2xl py-2 rounded-xl border-2 border-emerald-600">⬅</button>
  <button data-d="d" class="mzb kid-btn bg-emerald-500 text-white text-2xl py-2 rounded-xl border-2 border-emerald-600">⬇</button>
  <button data-d="r" class="mzb kid-btn bg-emerald-500 text-white text-2xl py-2 rounded-xl border-2 border-emerald-600">➡</button></div>`;
 const g=a.querySelector('#mzGrid');let won=false;
 function draw(){ g.innerHTML=''; m.forEach((row,r)=>row.forEach((ch,c)=>{const d=document.createElement('div');d.className='mz-cell '+(ch==='#'?'mz-wall':'mz-path');if(r===p.r&&c===p.c)d.textContent='🐱';else if(ch==='H')d.textContent='🏠';g.appendChild(d);})); }
 function mv(d){ if(won)return; const nr=p.r+(d==='u'?-1:d==='d'?1:0),nc=p.c+(d==='l'?-1:d==='r'?1:0); if(m[nr][nc]==='#'){bad();return;} p={r:nr,c:nc};tone(500,0.08);draw(); if(nr===h.r&&nc===h.c){won=true;win(10,t('mzWin'));} }
 a.querySelectorAll('.mzb').forEach(b=>b.onclick=()=>mv(b.dataset.d));
 const key=e=>{const k={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(k){e.preventDefault();mv(k);}};
 window.addEventListener('keydown',key); gameCleanup=()=>window.removeEventListener('keydown',key);
 draw();
}

/* ===== 5. Number race ===== */
function numberGame(){
 const a=document.getElementById('gameArea');
 const pool=['🍎','⭐','🐟','🎈','🍪','🐥'];
 let pos=0,round=0,n;
 a.innerHTML=`<div dir="ltr" class="relative h-16 bg-slate-200 rounded-full border-4 border-indigo-300 mb-5 overflow-hidden"><div class="absolute right-2 top-1/2 -translate-y-1/2 text-3xl">🏁</div><div id="nrCar" class="absolute top-1/2 -translate-y-1/2 text-4xl transition-all duration-500" style="left:2%">🏎️</div></div>

 <div id="nrOpts" class="flex justify-center gap-4"></div>`;
 function next(){ n=1+Math.floor(Math.random()*9); const e=pool[Math.floor(Math.random()*pool.length)]; a.querySelector('#nrItems').textContent=e.repeat(n);
  const opts=new Set([n]); while(opts.size<3)opts.add(Math.max(1,Math.min(9,n+Math.floor(Math.random()*5)-2)));
  a.querySelector('#nrOpts').innerHTML=shuffle([...opts]).map(o=>`<button data-v="${o}" class="nrb kid-btn bg-indigo-500 text-white text-3xl font-black w-20 h-20 rounded-2xl border-2 border-indigo-600">${num(o)}</button>`).join('');
  a.querySelectorAll('.nrb').forEach(b=>b.onclick=()=>{ if(+b.dataset.v===n){good();round++;pos=round*20;a.querySelector('#nrCar').style.left=Math.min(pos,88)+'%';if(round>=5){a.querySelector('#nrOpts').innerHTML='';setTimeout(()=>win(10,t('nrWin')),500);}else setTimeout(next,500);}else{bad();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),300);} });
 }
 next();
}

/* ===== 7. Quick math (8-12) ===== */
function mathGame(){
 const a=document.getElementById('gameArea');
 const TOTAL=10, SECS=12; let q=0, right=0, timer=null, left=SECS, ans=0;
 function make(){
  const lvl=Math.min(2,Math.floor(q/4)); const ops=lvl===0?['+','-']:lvl===1?['+','-','×']:['×','×','+','-'];
  const op=ops[Math.floor(Math.random()*ops.length)]; let x,y;
  if(op==='×'){x=2+Math.floor(Math.random()*(lvl===2?11:8));y=2+Math.floor(Math.random()*9);ans=x*y;}
  else if(op==='+'){x=10+Math.floor(Math.random()*(lvl?90:40));y=5+Math.floor(Math.random()*(lvl?60:30));ans=x+y;}
  else{x=20+Math.floor(Math.random()*(lvl?80:40));y=5+Math.floor(Math.random()*(x-5));ans=x-y;}
  const opts=new Set([ans]); while(opts.size<4){const d=(Math.floor(Math.random()*9)+1)*(Math.random()<.5?-1:1); if(ans+d>=0)opts.add(ans+d);}
  return {text:`${num(x)} ${op} ${num(y)} = ؟`.replace('؟',lang==='ar'?'؟':'?'),opts:shuffle([...opts])};
 }
 function render(){
  if(q>=TOTAL){ clearInterval(timer); const s=right; a.innerHTML=`<p class="text-center text-xl font-black text-slate-700 mt-4">${t('mathResult')} ${num(s)} / ${num(TOTAL)}</p>`; if(s>=7) win(s); else { const d=document.createElement('p'); d.className='text-center text-lg font-bold text-rose-600 mt-2'; d.textContent=t('lcLose'); a.appendChild(d); addStars(s); } return; }
  const m=make(); left=SECS;
  a.innerHTML=`<div class="flex justify-between items-center mb-3 font-black text-slate-700"><span>${t('question')} ${num(q+1)}/${num(TOTAL)}</span><span>✅ ${num(right)}</span></div>
  <div class="h-3 bg-slate-200 rounded-full overflow-hidden mb-5"><div id="mtBar" class="h-full bg-orange-500 transition-all duration-1000" style="width:100%"></div></div>
  <div dir="ltr" class="text-center text-5xl sm:text-6xl font-black text-orange-600 bg-orange-50 rounded-2xl py-6 mb-5 border-4 border-orange-200">${m.text}</div>
  <div class="grid grid-cols-2 gap-3 max-w-sm mx-auto">${m.opts.map(o=>`<button data-v="${o}" class="mtb kid-btn bg-orange-500 text-white text-3xl font-black py-4 rounded-2xl border-2 border-orange-600">${num(o)}</button>`).join('')}</div>`;
  a.querySelectorAll('.mtb').forEach(b=>b.onclick=()=>{ clearInterval(timer); a.querySelectorAll('.mtb').forEach(x=>x.disabled=true);
   if(+b.dataset.v===ans){right++;good();b.classList.replace('bg-orange-500','bg-green-500');} else {bad();b.classList.replace('bg-orange-500','bg-rose-500');a.querySelector(`.mtb[data-v="${ans}"]`).classList.replace('bg-orange-500','bg-green-500');}
   q++; setTimeout(render,700); });
  clearInterval(timer); timer=setInterval(()=>{ left--; const bar=a.querySelector('#mtBar'); if(bar)bar.style.width=(left/SECS*100)+'%';
   if(left<=0){ clearInterval(timer); bad(); a.querySelectorAll('.mtb').forEach(x=>x.disabled=true); const c=a.querySelector(`.mtb[data-v="${ans}"]`); if(c)c.classList.replace('bg-orange-500','bg-green-500'); q++; setTimeout(render,900);} },1000);
 }
 gameCleanup=()=>clearInterval(timer);
 render();
}

function simonGame(){
 const a=document.getElementById('gameArea');
 const PADS=[{c:'#ef4444',on:'#fca5a5',f:330},{c:'#22c55e',on:'#86efac',f:392},{c:'#3b82f6',on:'#93c5fd',f:494},{c:'#eab308',on:'#fde047',f:587}];
 let seq=[], pos=0, busy=true, alive=true, timers=[];
 const GOAL=10;
 a.innerHTML=`<div class="flex justify-between items-center mb-3 font-black text-slate-700"><span id="smLvl">${t('simonLevel')} ${num(0)}</span><span>🏆 ${num(GOAL)}</span></div>
 <p id="smMsg" class="text-center font-black text-lg text-slate-600 mb-4 min-h-[28px]"></p>
 <div class="grid grid-cols-2 gap-3 max-w-xs mx-auto mb-5">${PADS.map((p,i)=>`<button data-i="${i}" class="smp rounded-3xl border-4 border-white shadow-lg" style="aspect-ratio:1;background:${p.c};transition:all .15s"></button>`).join('')}</div>
 <div class="text-center"><button id="smStart" class="kid-btn bg-pink-500 text-white font-black text-xl px-8 py-3 rounded-2xl border-2 border-pink-600">${t('simonStart')}</button></div>`;
 const pads=[...a.querySelectorAll('.smp')], msg=a.querySelector('#smMsg');
 const later=(fn,ms)=>{const id=setTimeout(()=>{if(alive)fn();},ms);timers.push(id);};
 function flash(i,ms=420){ const p=pads[i]; p.style.background=PADS[i].on; p.style.transform='scale(1.06)'; tone(PADS[i].f,ms/1000,'triangle',0.25); later(()=>{p.style.background=PADS[i].c;p.style.transform='';},ms); }
 function playSeq(){ busy=true; msg.textContent=t('simonWatch'); a.querySelector('#smLvl').textContent=t('simonLevel')+' '+num(seq.length);
  const gap=Math.max(350,700-seq.length*30); seq.forEach((i,k)=>later(()=>flash(i,gap*0.7),600+k*gap));
  later(()=>{busy=false;pos=0;msg.textContent=t('simonGo');},600+seq.length*gap); }
 function next(){ seq.push(Math.floor(Math.random()*4)); playSeq(); }
 pads.forEach(p=>p.onclick=()=>{ if(busy)return; const i=+p.dataset.i; flash(i,250);
  if(i!==seq[pos]){ busy=true; bad(); msg.textContent=t('simonLose')+' '+num(seq.length); addStars(seq.length-1>0?seq.length-1:0); a.querySelector('#smStart').classList.remove('hidden'); return; }
  pos++; if(pos===seq.length){ busy=true; if(seq.length>=GOAL){ win(15); return; } good(); later(next,700); } });
 a.querySelector('#smStart').onclick=e=>{ e.target.classList.add('hidden'); seq=[]; next(); };
 gameCleanup=()=>{alive=false;timers.forEach(clearTimeout);};
}

/* ===== 10. Sliding puzzle (8-12) ===== */
function puzzleGame(n){
 const a=document.getElementById('gameArea'); n=n||3;
 let tiles=[...Array(n*n).keys()].map(i=>(i+1)%(n*n)), moves=0, done=false;
 const nb=i=>{const r=Math.floor(i/n),c=i%n,o=[];if(r>0)o.push(i-n);if(r<n-1)o.push(i+n);if(c>0)o.push(i-1);if(c<n-1)o.push(i+1);return o;};
 let blank=tiles.indexOf(0), prev=-1;
 for(let k=0;k<(n===3?80:200);k++){ const o=nb(blank).filter(x=>x!==prev); const m=o[Math.floor(Math.random()*o.length)]; [tiles[blank],tiles[m]]=[tiles[m],tiles[blank]]; prev=blank; blank=m; }
 a.innerHTML=`<div class="flex flex-wrap justify-between items-center gap-2 mb-3"><span class="font-black text-slate-700">${t('pzMoves')} <span id="pzM">${num(0)}</span></span>

 const g=a.querySelector('#pzG');
 function draw(){ g.innerHTML=tiles.map((v,i)=>v?`<button data-i="${i}" class="pzt kid-btn bg-cyan-500 text-white font-black rounded-xl border-2 border-cyan-600 ${n===3?'text-4xl':'text-3xl'}" style="aspect-ratio:1">${num(v)}</button>`:`<div style="aspect-ratio:1"></div>`).join('');
  g.querySelectorAll('.pzt').forEach(b=>b.onclick=()=>{ if(done)return; const i=+b.dataset.i, z=tiles.indexOf(0); if(!nb(z).includes(i)){bad();return;}
   [tiles[z],tiles[i]]=[tiles[i],tiles[z]]; moves++; tone(520,0.06); a.querySelector('#pzM').textContent=num(moves); draw();
   if(tiles.every((v,k)=>v===(k+1)%(n*n))){ done=true; win(n===3?12:25,t('pzWin')); } }); }

/* ===== 11. Tic-tac-toe vs computer (8-12) ===== */
function tttGame(){
 const a=document.getElementById('gameArea');
 let score={w:0,l:0,d:0}, hard=false;
 const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 const winner=b=>{for(const[x,y,z]of LINES)if(b[x]&&b[x]===b[y]&&b[x]===b[z])return{p:b[x],l:[x,y,z]};return b.every(Boolean)?{p:'D'}:null;};
 function minimax(b,me){ const w=winner(b); if(w)return w.p==='O'?10:w.p==='X'?-10:0; const sc=[]; b.forEach((v,i)=>{if(!v){b[i]=me;sc.push(minimax(b,me==='O'?'X':'O'));b[i]='';}}); return me==='O'?Math.max(...sc):Math.min(...sc); }
 function cpuMove(b){ const free=b.map((v,i)=>v?null:i).filter(v=>v!==null);
  if(!hard && Math.random()<0.45) return free[Math.floor(Math.random()*free.length)];
  let best=-99,mv=free[0]; for(const i of free){ b[i]='O'; const s=minimax(b,'X'); b[i]=''; if(s>best){best=s;mv=i;} } return mv; }
 function round(){
  let b=Array(9).fill(''), over=false;
  a.innerHTML=`<div class="flex flex-wrap justify-center gap-2 mb-3 font-black text-sm sm:text-base">
   <span class="bg-lime-100 border-2 border-lime-300 rounded-xl px-3 py-1">${t('tttYou')}: ${num(score.w)}</span>
   <span class="bg-slate-100 border-2 border-slate-300 rounded-xl px-3 py-1">${t('tttDraw')}: ${num(score.d)}</span>
   <span class="bg-rose-100 border-2 border-rose-300 rounded-xl px-3 py-1">${t('tttCpu')}: ${num(score.l)}</span></div>
  <div class="flex justify-center gap-2 mb-3"><button data-h="0" class="tth kid-btn ${!hard?'bg-lime-600':'bg-lime-400'} text-white font-black px-4 py-1.5 rounded-xl border-2 border-lime-700 text-sm">${t('tttEasy')}</button><button data-h="1" class="tth kid-btn ${hard?'bg-lime-600':'bg-lime-400'} text-white font-black px-4 py-1.5 rounded-xl border-2 border-lime-700 text-sm">${t('tttHard')}</button></div>
  <p id="ttMsg" class="text-center font-black text-lg text-slate-700 mb-3">${t('tttYourTurn')}</p>
  <div id="ttG" dir="ltr" class="grid grid-cols-3 gap-2 max-w-xs mx-auto"></div>
  <div class="text-center mt-4"><button id="ttNew" class="kid-btn hidden bg-lime-500 text-white font-black px-6 py-2 rounded-2xl border-2 border-lime-600">${t('tttAgain')}</button></div>`;
  a.querySelectorAll('.tth').forEach(x=>x.onclick=()=>{hard=x.dataset.h==='1';pop();round();});
  const g=a.querySelector('#ttG'), msg=a.querySelector('#ttMsg');
  const draw=(hl=[])=>{ g.innerHTML=b.map((v,i)=>`<button data-i="${i}" class="ttc rounded-2xl border-4 ${hl.includes(i)?'border-amber-400 bg-amber-100':'border-lime-300 bg-white'} text-5xl font-black" style="aspect-ratio:1">${v==='X'?'❌':v==='O'?'⭕':''}</button>`).join('');
   g.querySelectorAll('.ttc').forEach(c=>c.onclick=()=>play(+c.dataset.i)); };
  function end(w){ over=true; draw(w.l||[]); a.querySelector('#ttNew').classList.remove('hidden');
   if(w.p==='X'){score.w++; win(hard?15:8,t('tttWin'));} else if(w.p==='O'){score.l++; bad(); msg.textContent=t('tttLose');} else {score.d++; good(); addStars(2); msg.textContent=t('tttTie');} }
  function play(i){ if(over||b[i])return; b[i]='X'; pop(); let w=winner(b); if(w)return end(w);
   draw(); msg.textContent='🤔...'; over=true;
   setTimeout(()=>{ if(!document.getElementById('ttG'))return; over=false; b[cpuMove(b)]='O'; tone(300,0.1); const w2=winner(b); if(w2)return end(w2); draw(); msg.textContent=t('tttYourTurn'); },450); }
  a.querySelector('#ttNew').onclick=()=>{pop();round();};
  draw();
 }
 round();
}

applyLang();
</script>
</body>
</html>
